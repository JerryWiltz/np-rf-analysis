<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 540 480"
     role="img"
     aria-labelledby="title description">
  <title id="title">3 dB pi attenuator</title>
  <desc id="description">A 50 ohm pi attenuator with 292.4 ohm input and output shunt resistors, a 17.6 ohm series resistor, two ideal tee junctions, and nP nodes 1 through 8.</desc>
  <metadata id="layout-centering">{&quot;centerAxisX&quot;:270,&quot;centerReference&quot;:&quot;R2 midpoint&quot;}</metadata>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <g fill="none"
     stroke="#202020"
     stroke-width="2"
     stroke-linecap="round"
     stroke-linejoin="round">
    <!-- Tee 1: nP ports at nodes 2, 1, and 3 -->
    <line x1="140" y1="140" x2="160" y2="140"/>
    <rect x="160" y="120" width="40" height="40"/>
    <circle cx="180" cy="150" r="3" fill="#202020"/>
    <line x1="200" y1="140" x2="220" y2="140"/>
    <line x1="180" y1="160" x2="180" y2="180"/>
    <circle cx="140" cy="140" r="4" fill="#202020"/>
    <circle cx="220" cy="140" r="4" fill="#202020"/>
    <circle cx="180" cy="180" r="4" fill="#202020"/>

    <!-- R2: node 3 to node 5 -->
    <line x1="220" y1="140" x2="240" y2="140"/>
    <path d="M 240 140
             L 245 130
             L 255 150
             L 265 130
             L 275 150
             L 285 130
             L 295 150
             L 300 140"/>
    <line x1="300" y1="140" x2="320" y2="140"/>
    <circle cx="320" cy="140" r="4" fill="#202020"/>

    <!-- Tee 2: nP ports at nodes 6, 5, and 7 -->
    <line x1="320" y1="140" x2="340" y2="140"/>
    <rect x="340" y="120" width="40" height="40"/>
    <circle cx="360" cy="150" r="3" fill="#202020"/>
    <line x1="380" y1="140" x2="400" y2="140"/>
    <line x1="360" y1="160" x2="360" y2="180"/>
    <circle cx="400" cy="140" r="4" fill="#202020"/>
    <circle cx="360" cy="180" r="4" fill="#202020"/>

    <!-- R1: node 2 to node 4 -->
    <line x1="180" y1="180" x2="180" y2="200"/>
    <path d="M 180 200
             L 170 205
             L 190 215
             L 170 225
             L 190 235
             L 170 245
             L 190 255
             L 180 260"/>
    <line x1="180" y1="260" x2="180" y2="280"/>
    <circle cx="180" cy="280" r="4" fill="#202020"/>

    <!-- Short at node 4 -->
    <line x1="180" y1="280" x2="180" y2="340"/>
    <rect x="160" y="340" width="40" height="40"/>

    <!-- R3: node 6 to node 8 -->
    <line x1="360" y1="180" x2="360" y2="200"/>
    <path d="M 360 200
             L 350 205
             L 370 215
             L 350 225
             L 370 235
             L 350 245
             L 370 255
             L 360 260"/>
    <line x1="360" y1="260" x2="360" y2="280"/>
    <circle cx="360" cy="280" r="4" fill="#202020"/>

    <!-- Short at node 8 -->
    <line x1="360" y1="280" x2="360" y2="340"/>
    <rect x="340" y="340" width="40" height="40"/>

    <!-- Circled nP node numbers -->
    <circle cx="140" cy="100" r="12" fill="#ffffff"/>
    <circle cx="220" cy="100" r="12" fill="#ffffff"/>
    <circle cx="320" cy="100" r="12" fill="#ffffff"/>
    <circle cx="400" cy="100" r="12" fill="#ffffff"/>
    <circle cx="140" cy="180" r="12" fill="#ffffff"/>
    <circle cx="400" cy="180" r="12" fill="#ffffff"/>
    <circle cx="140" cy="280" r="12" fill="#ffffff"/>
    <circle cx="400" cy="280" r="12" fill="#ffffff"/>
  </g>

  <g fill="#202020"
     font-family="Arial, Helvetica, sans-serif"
     text-anchor="middle">
    <!-- External circuit ports -->
    <g font-size="16" font-weight="bold">
      <text x="140" y="60">Port 1</text>
      <text x="400" y="60">Port 2</text>
    </g>

    <!-- Component reference designators and values -->
    <g font-size="14" font-weight="bold">
      <text x="270" y="190">R2 = 17.6 Ω</text>
      <text x="150" y="235" text-anchor="end">R1 = 292.4 Ω</text>
      <text x="390" y="235" text-anchor="start">R3 = 292.4 Ω</text>
    </g>

    <!-- Ideal Tee occurrence labels -->
    <g font-size="12">
      <text x="180" y="110">Tee 1</text>
      <text x="360" y="110">Tee 2</text>
    </g>

    <!-- Circled nP node numbers -->
    <g font-size="14">
      <text x="140" y="105">1</text>
      <text x="220" y="105">3</text>
      <text x="320" y="105">5</text>
      <text x="400" y="105">7</text>
      <text x="140" y="185">2</text>
      <text x="400" y="185">6</text>
      <text x="140" y="285">4</text>
      <text x="400" y="285">8</text>
    </g>

    <!-- Ideal termination labels -->
    <g font-size="14">
      <text x="180" y="430">Short</text>
      <text x="360" y="430">Short</text>
    </g>
  </g>
</svg>
