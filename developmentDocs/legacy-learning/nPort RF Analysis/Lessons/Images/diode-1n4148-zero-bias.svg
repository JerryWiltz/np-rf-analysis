<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-labelledby="title description">
  <title id="title">Zero-bias 1N4148 diode two-port</title>
  <desc id="description">A zero-bias 1N4148 diode model with its anode at port 1 and cathode at port 2.</desc>
  <metadata id="layout-centering">{&quot;centerAxisX&quot;:220,&quot;centerReference&quot;:&quot;diode two-port midpoint&quot;}</metadata>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M120 120 H185 M245 120 H320"/><path d="M185 90 L245 120 L185 150 Z"/><path d="M245 90 V150"/></g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g font-size="16" font-weight="bold"><text x="220" y="45">D1 = nP.diode1N4148()</text><text x="220" y="70">bias voltage = 0 V</text></g>
    <g font-size="15"><text x="150" y="105">anode</text><text x="280" y="105">cathode</text><text x="120" y="165">Port 1</text><text x="320" y="165">Port 2</text></g>
    <circle cx="120" cy="120" r="4"/><circle cx="320" cy="120" r="4"/>
  </g>
</svg>
