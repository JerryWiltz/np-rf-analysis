<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" role="img" aria-labelledby="title description">
  <title id="title">Synthesized Chebyshev low-pass network</title>
  <desc id="description">A two-port Chebyshev low-pass network with a 200 megahertz passband edge in a 50 ohm system.</desc>
  <metadata id="layout-centering">{&quot;centerAxisX&quot;:220,&quot;centerReference&quot;:&quot;synthesized-network block midpoint&quot;}</metadata>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M120 120 H170 M270 120 H320"/><rect x="170" y="80" width="100" height="80"/><path d="M185 105 H215 C225 105 225 135 240 135 H255"/></g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g font-size="16" font-weight="bold"><text x="220" y="35">Chebyshev low-pass filter</text></g>
    <g font-size="12" font-weight="bold"><text x="220" y="60">0.1 dB ripple · 200 MHz passband edge · 50 Ω</text></g>
    <g font-size="16"><text x="120" y="185">Port 1</text><text x="320" y="185">Port 2</text></g>
    <circle cx="120" cy="120" r="4"/><circle cx="320" cy="120" r="4"/>
  </g>
</svg>
