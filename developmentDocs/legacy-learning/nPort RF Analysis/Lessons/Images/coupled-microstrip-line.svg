<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" role="img" aria-labelledby="title description">
  <title id="title">Physical coupled microstrip line</title>
  <desc id="description">A four-port coupled microstrip line numbered clockwise from the upper-left port.</desc>
  <metadata id="layout-centering">{&quot;centerAxisX&quot;:220,&quot;centerReference&quot;:&quot;coupled-line midpoint&quot;}</metadata>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round">
    <path d="M80 130 H150 M290 130 H360 M80 150 H150 M290 150 H360"/>
  </g>
  <path d="M150 130 H290 M150 150 H290" fill="none" stroke="#b87333" stroke-width="12" stroke-linecap="butt"/>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g font-size="16" font-weight="bold"><text x="220" y="45">CL1 = nP.mclin()</text><text x="220" y="75">W = 19.1155 mil, S = 5.82185 mil, L = 719.794 mil</text></g>
    <g font-size="16"><text x="80" y="110">Port 1</text><text x="360" y="110">Port 2</text><text x="360" y="190">Port 3</text><text x="80" y="190">Port 4</text></g>
    <circle cx="150" cy="130" r="4"/><circle cx="290" cy="130" r="4"/><circle cx="290" cy="150" r="4"/><circle cx="150" cy="150" r="4"/>
    <circle cx="80" cy="130" r="4"/><circle cx="360" cy="130" r="4"/><circle cx="360" cy="150" r="4"/><circle cx="80" cy="150" r="4"/>
  </g>
</svg>
