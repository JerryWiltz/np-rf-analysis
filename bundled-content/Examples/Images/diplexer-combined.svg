  <title id="title">Combined COMPACT page 27 diplexer</title>
  <desc id="description">Top-level three-port diplexer. Tee port 1 is input node 1, port 2 feeds the high-pass network at node 2, and port 3 feeds the low-pass network at node 3. The branch outputs are nodes 4 and 5.</desc>
