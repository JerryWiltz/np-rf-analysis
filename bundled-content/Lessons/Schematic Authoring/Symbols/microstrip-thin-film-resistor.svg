<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" role="img" aria-labelledby="title description">
  <title id="title">nP mtfr microstrip thin-film resistor symbol</title>
  <desc id="description">A two-port microstrip thin-film resistor with its ports directly on the resistor body.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="100" y="70" width="80" height="40" fill="#606060" stroke="#202020" stroke-width="2"/>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">
    <text x="140" y="30">mtfr()</text><text x="140" y="140">microstrip thin-film resistor</text><text x="65" y="95">Port 1</text><text x="215" y="95">Port 2</text><circle cx="100" cy="90" r="4"/><circle cx="180" cy="90" r="4"/>
  </g>
</svg>
