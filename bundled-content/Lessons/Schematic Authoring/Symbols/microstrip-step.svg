<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title description">
  <title id="title">nP mstep physical microstrip width-step symbol</title>
  <desc id="description">A two-port physical microstrip width step from a wide trace at port 1 to a narrow trace at port 2.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="48" y="53" width="12" height="14" fill="#b87333"/>
  <rect x="60" y="57" width="12" height="6" fill="#b87333"/>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle">
    <text x="60" y="15">mstep()</text><text x="30" y="63">Port 1</text><text x="90" y="63">Port 2</text>
    <circle cx="48" cy="60" r="2"/><circle cx="72" cy="60" r="2"/>
  </g>
</svg>
