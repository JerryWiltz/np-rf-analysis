<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" role="img" aria-labelledby="title description">
  <title id="title">sePaLC()</title>
  <desc id="description">A two-port with internally parallel L-C elements in the series path.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 125 H160 M260 125 H380 M160 105 V155 M260 105 V155"/>
    <path d="M160 105 H160 M260 105 H260"/>
    <path d="M160 105 H180 C180 85 195 85 195 105 C195 85 210 85 210 105 C210 85 225 85 225 105 C225 85 240 85 240 105 H260"/>
    <path d="M160 155 H180 M240 155 H260"/>
    <path d="M180 155 H205 M215 155 H240 M205 145 V165 M215 145 V165"/>
  </g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="210" y="28" font-size="16" font-weight="bold">sePaLC()</text>
    <text x="210" y="50" font-size="13">internally parallel L-C</text>
    <text x="40" y="160" font-size="13">Port 1</text>
    <text x="380" y="160" font-size="13">Port 2</text>
