<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-labelledby="title description">
  <title id="title">paC()</title>
  <desc id="description">A two-port with an internally shunt C element.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 80 H380 M210 80 V110"/>
    <g transform="translate(210 110) rotate(90)"><path d="M0 0 H25 M35 0 H60 M25 -10 V10 M35 -10 V10"/></g>
    <path d="M210 170 V190 M200 190 H220 M204 198 H216 M208 206 H212"/>
  </g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="210" y="28" font-size="16" font-weight="bold">paC()</text>
    <text x="210" y="50" font-size="13">internally shunt C</text>
    <text x="40" y="115" font-size="13">Port 1</text>
    <text x="380" y="115" font-size="13">Port 2</text>
    <circle cx="40" cy="80" r="4"/><circle cx="380" cy="80" r="4"/>
  </g>
