<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-labelledby="title description">
  <title id="title">paR()</title>
  <desc id="description">A two-port with an internally shunt R element.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 80 H380 M210 80 V110"/>
    <g transform="translate(210 110) rotate(90)"><path d="M0 0 H20 L25 -10 L35 10 L45 -10 L55 10 L65 -10 L75 10 L80 0 H100"/></g>
    <path d="M210 210 V230 M200 230 H220 M204 238 H216 M208 246 H212"/>
  </g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="210" y="28" font-size="16" font-weight="bold">paR()</text>
    <text x="210" y="50" font-size="13">internally shunt R</text>
    <text x="40" y="115" font-size="13">Port 1</text>
    <text x="380" y="115" font-size="13">Port 2</text>
