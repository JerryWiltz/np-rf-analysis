<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" role="img" aria-labelledby="title description">
  <title id="title">nP trf two-port transformer symbol</title>
  <desc id="description">An ideal two-port transformer with primary port 1 on the upper left and secondary port 2 on the upper right.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 80 H110 M170 80 H240 M110 80 C90 80 90 100 110 100 C90 100 90 120 110 120 C90 120 90 140 110 140 C90 140 90 160 110 160 M170 80 C190 80 190 100 170 100 C190 100 190 120 170 120 C190 120 190 140 170 140 C190 140 190 160 170 160 M137 70 V170 M143 70 V170"/>
  </g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">
    <text x="140" y="30">trf()</text><text x="40" y="65">Port 1</text><text x="240" y="65">Port 2</text>
    <circle cx="40" cy="80" r="4"/><circle cx="240" cy="80" r="4"/>
  </g>
</svg>
