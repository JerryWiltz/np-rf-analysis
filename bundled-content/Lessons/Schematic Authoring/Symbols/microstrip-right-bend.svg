<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title description">
  <title id="title">nP mbend right-turn physical microstrip bend symbol</title>
  <desc id="description">A two-port 90-degree physical microstrip bend with port 1 entering from the left and turning right to port 2 at the bottom.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <path d="M54 40 H67 L74 47 V60 H60 V54 H54 Z" fill="#b87333"/>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle">
    <text x="60" y="15">mbend() right turn</text><text x="35" y="67">Port 1</text><text x="83" y="70">Port 2</text><circle cx="54" cy="47" r="2"/><circle cx="67" cy="60" r="2"/>
  </g>
</svg>
