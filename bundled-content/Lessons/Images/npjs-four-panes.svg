<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 760 680"
     role="img"
     aria-labelledby="title description">
  <title id="title">The four panes of an npjs display</title>
  <desc id="description">A light-theme nPort RF Analysis display showing the Controls, JavaScript, Console, and Errors panes with the warning bar and rendered Run, Stop, and Reset buttons.</desc>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Active pane backgrounds -->
  <rect x="20" y="55" width="720" height="42" fill="#ec7500"/>
  <rect x="20" y="210" width="720" height="135" fill="#f6f6f6"/>
  <rect x="20" y="410" width="720" height="90" fill="#f6f6f6"/>
  <rect x="20" y="565" width="720" height="90" fill="#f6f6f6"/>

  <!-- Controls -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="20" y="40" fill="#202124" font-size="18" font-weight="bold">1  Controls Pane</text>

    <rect x="20" y="116" width="45" height="30" rx="5"
          fill="#f5f5f5"/>
    <rect x="20" y="115" width="45" height="30" rx="5"
          fill="#ffffff" stroke="#e0e0e0"/>
    <text x="42.5" y="135" fill="#222222" font-size="13" text-anchor="middle">Run</text>

    <g opacity="0.7">
      <rect x="73" y="116" width="49" height="30" rx="5"
            fill="#f5f5f5"/>
      <rect x="73" y="115" width="49" height="30" rx="5"
            fill="#ffffff" stroke="#e0e0e0"/>
      <text x="97.5" y="135" fill="#222222" font-size="13" text-anchor="middle">Stop</text>
    </g>

    <rect x="130" y="116" width="57" height="30" rx="5"
          fill="#f5f5f5"/>
    <rect x="130" y="115" width="57" height="30" rx="5"
          fill="#ffffff" stroke="#e0e0e0"/>
    <text x="158.5" y="135" fill="#222222" font-size="13" text-anchor="middle">Reset</text>

    <text x="199" y="135" fill="#5c5c5c" font-size="13">Status: Error</text>
  </g>

  <!-- JavaScript source -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="20" y="195" fill="#202124" font-size="18" font-weight="bold">2  JavaScript Pane</text>
    <rect x="670" y="220" width="50" height="26" rx="4" fill="#e4e4e4"/>
    <text x="695" y="238" fill="#5c5c5c" font-size="13" font-weight="bold" text-anchor="middle">npjs</text>
    <g font-family="Courier New, Courier, monospace" font-size="16">
      <text x="45" y="250" fill="#6f42c1">var</text>
      <text x="80" y="250" fill="#202124">r1 = nP.R(75);</text>
      <text x="45" y="282" fill="#202124">console.log("R1 is ready.");</text>
      <text x="45" y="314" fill="#202124">notDefined();</text>
    </g>
  </g>

  <!-- Console/log output -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="20" y="395" fill="#202124" font-size="18" font-weight="bold">3  Console Pane</text>
    <g font-family="Courier New, Courier, monospace" font-size="16" fill="#202124">
      <text x="45" y="460">[log] R1 is ready.</text>
    </g>
  </g>

  <!-- Error output -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="20" y="550" fill="#202124" font-size="18" font-weight="bold">4  Errors Pane</text>
    <g font-family="Courier New, Courier, monospace" font-size="16" fill="#202124">
      <text x="45" y="603">nP JavaScript</text>
      <text x="45" y="635">ReferenceError: notDefined is not defined</text>
    </g>
  </g>
</svg>
