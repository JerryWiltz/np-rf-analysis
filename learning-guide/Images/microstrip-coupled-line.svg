<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="title description">
  <title id="title">nP mclin physical coupled-microstrip symbol</title>
  <desc id="description">A physical four-port coupled microstrip line numbered clockwise from the upper-left port.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <path d="M80 100 H220 M80 120 H220" fill="none" stroke="#b87333" stroke-width="12" stroke-linecap="butt"/>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="160" y="30">mclin()</text><text x="80" y="80">Port 1</text><text x="220" y="80">Port 2</text><text x="220" y="150">Port 3</text><text x="80" y="150">Port 4</text>
    <circle cx="80" cy="100" r="4"/><circle cx="220" cy="100" r="4"/><circle cx="220" cy="120" r="4"/><circle cx="80" cy="120" r="4"/>
  </g>
</svg>
