<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-labelledby="title description">
  <title id="title">nP mvgnd one-port microstrip-via-to-ground symbol</title>
  <desc id="description">A one-port physical via from a microstrip pad to the ground plane.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <path d="M40 90 H100" fill="none" stroke="#b87333" stroke-width="12" stroke-linecap="butt"/>
  <circle cx="120" cy="90" r="28" fill="#b87333" stroke="#202020" stroke-width="2"/><circle cx="120" cy="90" r="10" fill="#ffffff" stroke="#202020" stroke-width="2"/>
  <path d="M120 100 V160 M95 160 H145 M102 168 H138 M110 176 H130" fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round"/>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="120" y="30">mvgnd()</text><text x="40" y="120">Port 1</text><text x="170" y="95">via</text><circle cx="40" cy="90" r="4"/>
  </g>
</svg>
