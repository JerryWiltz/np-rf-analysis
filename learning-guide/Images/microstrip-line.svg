<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-labelledby="title description">
  <title id="title">nP mlin physical microstrip-line symbol</title>
  <desc id="description">A physical two-port microstrip line with port 1 on the left and port 2 on the right.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <path d="M80 100 H220" fill="none" stroke="#b87333" stroke-width="12" stroke-linecap="butt"/>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">
    <text x="150" y="30">mlin()</text><text x="150" y="160">physical microstrip</text><text x="80" y="135">Port 1</text><text x="220" y="135">Port 2</text><circle cx="80" cy="100" r="4"/><circle cx="220" cy="100" r="4"/>
  </g>
</svg>
