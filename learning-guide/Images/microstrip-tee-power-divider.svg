<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 700 480"
     role="img"
     aria-labelledby="title description">
  <title id="title">Symmetric microstrip Tee power divider</title>
  <desc id="description">A three-port microstrip power divider symmetric about the horizontal axis through port 1, with two microstrip lines, three microstrip Tees, a thin-film isolation resistor, and nP nodes 1 through 9.</desc>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Inter-component wires -->
  <g fill="none"
     stroke="#202020"
     stroke-width="2"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M60 240 H147"/>
    <path d="M160 227 V140 H220"/>
    <path d="M160 253 V340 H220"/>
    <path d="M360 140 H427"/>
    <path d="M360 340 H427"/>
    <path d="M453 140 H620"/>
    <path d="M453 340 H620"/>
    <path d="M440 153 V200"/>
    <path d="M440 280 V327"/>
  </g>

  <!-- MT1: common port left, branches above and below -->
  <g fill="#b87333">
    <rect x="153" y="233" width="14" height="14"/>
    <rect x="147" y="233" width="6" height="14"/>
    <rect x="153" y="227" width="14" height="6"/>
    <rect x="153" y="247" width="14" height="6"/>
  </g>

  <!-- ML1 and ML2: equal 10 mil by 190 mil microstrip lines -->
  <path d="M220 140 H360 M220 340 H360"
        fill="none"
        stroke="#b87333"
        stroke-width="12"
        stroke-linecap="butt"/>

  <!-- MT2: common down, branch 1 left, branch 2 right -->
  <g fill="#b87333">
    <rect x="433" y="133" width="14" height="14"/>
    <rect x="427" y="133" width="6" height="14"/>
    <rect x="447" y="133" width="6" height="14"/>
    <rect x="433" y="147" width="14" height="6"/>
  </g>

  <!-- MT3: common up, branch 1 right, branch 2 left -->
  <g fill="#b87333">
    <rect x="433" y="333" width="14" height="14"/>
    <rect x="427" y="333" width="6" height="14"/>
    <rect x="447" y="333" width="6" height="14"/>
    <rect x="433" y="327" width="14" height="6"/>
  </g>

  <!-- TF1: microstrip thin-film isolation resistor -->
  <rect x="420" y="200" width="40" height="80" fill="#606060" stroke="#202020" stroke-width="2"/>

  <!-- Component terminals, common-port markers, and nP node dots -->
  <g fill="#202020">
    <!-- MT1 -->
    <circle cx="147" cy="240" r="2"/>
    <circle cx="160" cy="227" r="2"/>
    <circle cx="160" cy="253" r="2"/>
    <circle cx="156" cy="240" r="1.5"/>

    <!-- MT2 -->
    <circle cx="427" cy="140" r="2"/>
    <circle cx="453" cy="140" r="2"/>
    <circle cx="440" cy="153" r="2"/>
    <circle cx="440" cy="144" r="1.5"/>

    <!-- MT3 -->
    <circle cx="427" cy="340" r="2"/>
    <circle cx="453" cy="340" r="2"/>
    <circle cx="440" cy="327" r="2"/>
    <circle cx="440" cy="336" r="1.5"/>

    <!-- Thin-film resistor terminals -->
    <circle cx="440" cy="200" r="4"/>
    <circle cx="440" cy="280" r="4"/>

    <!-- Labeled nP nodes -->
    <circle cx="60" cy="240" r="4"/>
    <circle cx="220" cy="140" r="4"/>
    <circle cx="220" cy="340" r="4"/>
    <circle cx="360" cy="140" r="4"/>
    <circle cx="360" cy="340" r="4"/>
    <circle cx="620" cy="140" r="4"/>
    <circle cx="620" cy="340" r="4"/>
  </g>

  <!-- Circled nP node numbers -->
  <g fill="#ffffff" stroke="#202020" stroke-width="2">
    <circle cx="60" cy="200" r="12"/>
    <circle cx="220" cy="100" r="12"/>
    <circle cx="360" cy="100" r="12"/>
    <circle cx="620" cy="100" r="12"/>
    <circle cx="220" cy="380" r="12"/>
    <circle cx="360" cy="380" r="12"/>
    <circle cx="620" cy="380" r="12"/>
    <circle cx="480" cy="200" r="12"/>
    <circle cx="480" cy="280" r="12"/>
  </g>

  <g fill="#202020"
     font-family="Arial, Helvetica, sans-serif"
     text-anchor="middle">
    <text x="350" y="30" font-size="18" font-weight="bold">Microstrip Tee Power Divider</text>

    <!-- External ports -->
    <g font-size="16" font-weight="bold">
      <text x="60" y="275">Port 1</text>
      <text x="660" y="145">Port 2</text>
      <text x="660" y="345">Port 3</text>
    </g>

    <!-- Component labels -->
    <g font-size="13">
      <text x="180" y="225" text-anchor="start">MT1: Wc/W1/W2 = 23/10/10 mil</text>
      <text x="300" y="175">ML1: W = 10 mil, L = 190 mil</text>
      <text x="300" y="325">ML2: W = 10 mil, L = 190 mil</text>
      <text x="500" y="120">MT2: Wc/W1/W2 = 23/10/23 mil</text>
      <text x="500" y="370">MT3: Wc/W1/W2 = 23/23/10 mil</text>
      <text x="515" y="235">TF1 = mtfr()</text>
      <text x="515" y="255">100 Ω</text>
    </g>

    <!-- Circled node-number text -->
    <g font-size="14">
      <text x="60" y="205">1</text>
      <text x="220" y="105">2</text>
      <text x="360" y="105">4</text>
      <text x="620" y="105">6</text>
      <text x="220" y="385">3</text>
      <text x="360" y="385">5</text>
      <text x="620" y="385">7</text>
      <text x="480" y="205">8</text>
      <text x="480" y="285">9</text>
    </g>
  </g>
</svg>
