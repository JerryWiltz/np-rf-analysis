<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" role="img" aria-labelledby="title description">
  <title id="title">nP trf two-port transformer symbol</title>
  <desc id="description">An ideal two-port transformer model with port 1 on the left and port 2 on the right.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 90 H95 C95 70 110 70 110 90 C110 70 125 70 125 90 M155 90 C155 70 170 70 170 90 C170 70 185 70 185 90 H240 M137 60 V120 M143 60 V120"/>
  </g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">
    <text x="140" y="30">trf()</text><text x="40" y="125">Port 1</text><text x="240" y="125">Port 2</text>
    <circle cx="40" cy="90" r="4"/><circle cx="240" cy="90" r="4"/>
  </g>
</svg>
