<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" role="img" aria-labelledby="title description">
  <title id="title">nP mstep physical microstrip width-step symbol</title>
  <desc id="description">A two-port physical microstrip width step from a wide trace at port 1 to a narrow trace at port 2.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <path d="M40 90 H140" fill="none" stroke="#b87333" stroke-width="24" stroke-linecap="butt"/>
  <path d="M140 90 H240" fill="none" stroke="#b87333" stroke-width="10" stroke-linecap="butt"/>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">
    <text x="140" y="30">mstep()</text><text x="40" y="130">Port 1</text><text x="240" y="130">Port 2</text><circle cx="40" cy="90" r="4"/><circle cx="240" cy="90" r="4"/>
  </g>
</svg>
