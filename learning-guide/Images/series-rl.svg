<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 320 280"
     role="img"
     aria-labelledby="title description">
  <title id="title">Series RL circuit</title>
  <desc id="description">A 75 ohm resistor and a 5 nanohenry inductor connected in series between port 1 and port 2, with nP nodes 1, 2, and 3.</desc>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <g fill="none"
     stroke="#202020"
     stroke-width="2"
     stroke-linecap="round"
     stroke-linejoin="round">
    <!-- Port 1 and R1: node 1 to node 2 -->
    <line x1="60" y1="140" x2="80" y2="140"/>
    <circle cx="60" cy="140" r="4" fill="#202020"/>
    <path d="M 80 140
             L 85 130
             L 95 150
             L 105 130
             L 115 150
             L 125 130
             L 135 150
             L 140 140"/>
    <line x1="140" y1="140" x2="160" y2="140"/>
    <circle cx="160" cy="140" r="4" fill="#202020"/>

    <!-- L1: node 2 to node 3 -->
    <line x1="160" y1="140" x2="180" y2="140"/>
    <path d="M 180 140
             C 180 120, 195 120, 195 140
             C 195 120, 210 120, 210 140
             C 210 120, 225 120, 225 140
             C 225 120, 240 120, 240 140"/>
    <line x1="240" y1="140" x2="260" y2="140"/>
    <circle cx="260" cy="140" r="4" fill="#202020"/>

    <!-- Circled nP node numbers -->
    <circle cx="60" cy="180" r="12" fill="#ffffff"/>
    <circle cx="160" cy="180" r="12" fill="#ffffff"/>
    <circle cx="260" cy="180" r="12" fill="#ffffff"/>
  </g>

  <g fill="#202020"
     font-family="Arial, Helvetica, sans-serif"
     text-anchor="middle">
    <!-- Component reference designators and values -->
    <g font-size="14" font-weight="bold">
      <text x="110" y="90">R1 = 75 Ω</text>
      <text x="210" y="90">L1 = 5 nH</text>
    </g>

    <!-- Circled nP node numbers -->
    <g font-size="14">
      <text x="60" y="185">1</text>
      <text x="160" y="185">2</text>
      <text x="260" y="185">3</text>
    </g>

    <!-- External circuit ports -->
    <g font-size="16" font-weight="bold">
      <text x="60" y="230">Port 1</text>
      <text x="260" y="230">Port 2</text>
    </g>
  </g>
</svg>
