<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" role="img" aria-labelledby="title description">
  <title id="title">nP diode1N4148 two-port diode symbol</title>
  <desc id="description">A two-port 1N4148 diode model with anode at port 1 and cathode at port 2.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M40 90 H105 M175 90 H240"/><path d="M105 60 L165 90 L105 120 Z"/><path d="M165 60 V120"/></g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="140" y="30">diode1N4148()</text><text x="40" y="125">Port 1</text><text x="240" y="125">Port 2</text><text x="80" y="75">anode</text><text x="200" y="75">cathode</text><circle cx="40" cy="90" r="4"/><circle cx="240" cy="90" r="4"/>
  </g>
</svg>
