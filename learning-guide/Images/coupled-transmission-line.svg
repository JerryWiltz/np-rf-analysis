<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="title description">
  <title id="title">nP Tclin ideal coupled-transmission-line symbol</title>
  <desc id="description">An ideal four-port coupled transmission line numbered clockwise from the upper-left port.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M40 90 H100 M220 90 H280 M40 150 H100 M220 150 H280"/><rect x="100" y="60" width="120" height="120"/><path d="M120 100 H200 M120 140 H200"/></g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="160" y="30">Tclin()</text><text x="40" y="75">Port 1</text><text x="280" y="75">Port 2</text><text x="280" y="185">Port 3</text><text x="40" y="185">Port 4</text>
    <circle cx="40" cy="90" r="4"/><circle cx="280" cy="90" r="4"/><circle cx="280" cy="150" r="4"/><circle cx="40" cy="150" r="4"/>
  </g>
</svg>
