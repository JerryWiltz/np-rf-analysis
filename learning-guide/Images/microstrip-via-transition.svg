<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" role="img" aria-labelledby="title description">
  <title id="title">nP mvia two-port microstrip-via-transition symbol</title>
  <desc id="description">A two-port physical microstrip via transition between an upper and lower conductor layer.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M130 40 V220" stroke="#b87333" stroke-width="12"/><path d="M70 80 H190 M70 180 H190" stroke="#b87333" stroke-width="8"/><circle cx="130" cy="80" r="22" fill="#b87333"/><circle cx="130" cy="180" r="22" fill="#b87333"/>
  </g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="130" y="25">mvia()</text><text x="175" y="55">Port 1</text><text x="175" y="235">Port 2</text><circle cx="130" cy="40" r="4"/><circle cx="130" cy="220" r="4"/>
  </g>
</svg>
