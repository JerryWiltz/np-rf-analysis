<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" role="img" aria-labelledby="title description">
  <title id="title">nP Shift90 two-port phase-shift symbol</title>
  <desc id="description">A matched lossless two-port with a positive 90-degree through phase shift.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M40 80 H100 M180 80 H240"/><rect x="100" y="50" width="80" height="60"/></g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">
    <text x="140" y="30">Shift90()</text><text x="140" y="85">+90°</text><text x="40" y="115">Port 1</text><text x="240" y="115">Port 2</text><circle cx="40" cy="80" r="4"/><circle cx="240" cy="80" r="4"/>
  </g>
</svg>
